name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]

    env:
      MD2PDF_TEST_OUT: ${{ github.workspace }}/test-output

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Setup
        run: node bin/md2pdf.js setup

      - name: Doctor
        run: node bin/md2pdf.js doctor

      - name: Test
        run: npm test

      - name: Upload rendered output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ env.MD2PDF_TEST_OUT }}
          if-no-files-found: ignore
          retention-days: 7
